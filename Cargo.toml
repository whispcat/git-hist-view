[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/parse", "crates/wasm-parse", "crates/wasm-core"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
ghv-core = { path = "crates/core" }
ghv-parse = { path = "crates/parse" }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
sha1 = { version = "0.11", default-features = false }
imara-diff = "0.2"
rustc-hash = "2"
hashbrown = { version = "0.17", default-features = false }
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
wasm-bindgen = "=0.2.127"
js-sys = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.release.package.ghv-wasm-parse]
opt-level = "s"
